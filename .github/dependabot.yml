version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: scope
    groups:
      dev-tooling:
        patterns:
          - '@commitlint/*'
          - 'eslint*'
          - 'prettier*'
          - 'husky'
          - 'typescript'
    ignore:
      # Expo SDK and React Native move as one set; bump them via `expo install --fix`,
      # not one PR at a time.
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react-native'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'

      # eslint 10 is blocked by eslint-config-expo, whose eslint-plugin-import and
      # eslint-plugin-react peer ranges cap at ^9. Drop once both accept ^10.
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'

      # TypeScript 7 is blocked by typescript-eslint, which does not support it yet;
      # `pnpm run lint` exits 2 on it. Drop once typescript-eslint supports TS 7.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'

  # android/ is generated by `expo prebuild`, so the only checked-in Gradle build is the
  # native module's.
  - package-ecosystem: gradle
    directory: /modules/notif-filter/android
    schedule:
      interval: weekly
    commit-message:
      prefix: 'build'
