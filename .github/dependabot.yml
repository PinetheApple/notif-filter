version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait for a release to prove itself elsewhere before proposing it. Majors get
    # longest; security updates ignore cooldown entirely.
    cooldown:
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    commit-message:
      prefix: 'chore'
      include: scope
    groups:
      dev-tooling:
        patterns:
          - '@commitlint/*'
          - 'eslint*'
          - 'prettier*'
          - 'husky'
          - 'typescript'
    ignore:
      # Expo SDK and React Native move as one set; bump them via `expo install --fix`,
      # not one PR at a time.
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react-native'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'

      # Also SDK-pinned, and enforced by `expo install --check` in CI, so an individual
      # bump is always wrong rather than merely early. Named rather than react-native-*
      # so independent packages like react-native-css-interop still update.
      - dependency-name: 'react-native-gesture-handler'
      - dependency-name: 'react-native-reanimated'
      - dependency-name: 'react-native-safe-area-context'
      - dependency-name: 'react-native-screens'
      - dependency-name: 'react-native-web'
      - dependency-name: 'react-native-worklets'

      # eslint 10 is blocked by eslint-config-expo, whose eslint-plugin-import and
      # eslint-plugin-react peer ranges cap at ^9. Drop once both accept ^10.
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'

      # TypeScript 7 is blocked by typescript-eslint, which does not support it yet;
      # `pnpm run lint` exits 2 on it. Drop once typescript-eslint supports TS 7.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'

  # android/ is generated by `expo prebuild`, so the only checked-in Gradle build is the
  # native module's.
  - package-ecosystem: gradle
    directory: /modules/notif-filter/android
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    commit-message:
      prefix: 'build'
