name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run format:check

      - run: npm run lint

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # v6 defaults to the proprietary gradle-actions-caching component; 'basic' keeps
          # caching on the open-source GitHub Actions cache.
          cache-provider: basic

      # android/ is gitignored and regenerated, and settings.gradle autolinks through node,
      # so dependencies must be installed before the project can be generated at all.
      - run: npm ci

      - run: npx expo prebuild --platform android --no-install

      - run: ./gradlew :notif-filter:testDebugUnitTest
        working-directory: android

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: notif-filter-test-report
          path: modules/notif-filter/android/build/reports/tests/
          retention-days: 7
