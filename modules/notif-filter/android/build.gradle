plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.notiffilter'
version = '1.0.0'

android {
  // Distinct from the app's namespace: expo-module-gradle-plugin forces BuildConfig
  // generation on, and sharing app.notiffilter collides with the app's at dex merge.
  namespace "app.notiffilter.module"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20231013'
}
