# Expo/RN Gradle autolinking resolves packages with `node --print require.resolve(...)` from
# the project root, which cannot see pnpm's default symlinked tree of transitive deps.
nodeLinker: hoisted

# eslint-import-resolver-typescript's native binary; pnpm blocks postinstall
# scripts unless the package is approved here.
allowBuilds:
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.16'
  - '@expo/config@57.0.8'
  - '@expo/fingerprint@0.20.8'
  - '@expo/inline-modules@0.1.6'
  - '@expo/log-box@57.0.3'
  - expo-asset@57.0.12
  - expo-constants@57.0.12
  - expo@57.0.14
  - expo-build-properties@57.0.12
  - expo-router@57.0.14
  - expo-splash-screen@57.0.7
